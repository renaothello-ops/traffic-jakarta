# Firestore (33) + Storage emulator (2) rules tests — local emulators only, no production deploy.
name: Security rules (emulators)

on:
  workflow_dispatch:
  push:
    branches: [main, master, release/traffic-jakarta-public-prep]
    paths:
      - ".github/workflows/security-rules-emulators.yml"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "tests/**"
      - "scripts/kill-emulators.mjs"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/security-rules-emulators.yml"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "tests/**"
      - "scripts/kill-emulators.mjs"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: security-rules-emulators-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Firestore security rules (44 tests)
        env:
          CI: "true"
        run: npm run test:rules:ci

      - name: Storage security rules — emulator (2 tests)
        env:
          CI: "true"
        run: npm run test:storage-rules:emulator:ci
